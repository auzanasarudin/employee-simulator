<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAMS=[{c:'MBOM',col:'#2f6fd6',subs:['Revise Info','Leaden Meeting','BOM Meeting','Reman','Request Item']},{c:'COST EST',col:'#d9731a',subs:['Fabrikasi','Painting','Assembly','Full']},{c:'ROBOT WELDING',col:'#8a4fd1',subs:['Web Visualisasi','Analisa']},{c:'ADDITIONAL',col:'#238a5a',subs:['5S','SS (Suggestion System)','SGA']}];
const H=['Task ID','Nama Pekerjaan (Kategori Utama)','Sub-Pekerjaan / Detail','Deskripsi / Scope Pekerjaan','PIC','Prioritas','Target Deadline','Status Pengerjaan','% Progress','Kendala / Notes'];
const CSV=H.join(',')+`
TSK-001,MBOM,Revise Info,Pembaruan struktur MBOM excavator arm line,Auzan Asarudin,High,15/10/2026,In Progress,60%,Menunggu revisi drawing
TSK-002,MBOM,Leaden Meeting,Koordinasi sinkronisasi data MBOM dengan production,Auzan Asarudin,Medium,18/10/2026,Not Started,0%,Jadwal meeting tentatif
TSK-003,MBOM,BOM Meeting,Pembahasan struktur part baru,Auzan Asarudin,High,20/10/2026,Not Started,0%,-
TSK-004,MBOM,Reman,Analisis komponen remanufacturing,Auzan Asarudin,Medium,25/10/2026,Not Started,0%,-
TSK-005,MBOM,Request Item,Pengajuan part/item baru ke sistem,Auzan Asarudin,Low,28/10/2026,Not Started,0%,-
TSK-006,COST EST,Fabrikasi,Kalkulasi estimasi biaya proses fabrikasi plat,Auzan Asarudin,High,16/10/2026,Completed,100%,Selesai diverifikasi
TSK-007,COST EST,Painting,Estimasi biaya konsumabel cat & proses,Auzan Asarudin,Medium,22/10/2026,In Progress,40%,-
TSK-008,COST EST,Assembly,Kalkulasi waktu & cost line perakitan,Auzan Asarudin,High,24/10/2026,Not Started,0%,-
TSK-009,COST EST,Full,Rekapitulasi total manufacturing cost,Auzan Asarudin,High,30/10/2026,Not Started,0%,Menunggu data painting
TSK-010,ROBOT WELDING,Web Visualisasi,Pengembangan dashboard web monitoring robot,Auzan Asarudin,High,27/10/2026,In Progress,75%,Integrasi koneksi data
TSK-011,ROBOT WELDING,Analisa,Analisis performa welding current & RUL LSTM,Auzan Asarudin,High,29/10/2026,In Progress,50%,Pengolahan data history error
TSK-012,ADDITIONAL,5S,Audit dan perbaikan area kerja welding line,Auzan Asarudin,Low,15/10/2026,Completed,100%,-
TSK-013,ADDITIONAL,SS (Suggestion System),Ide efisiensi siklus pengelasan,Auzan Asarudin,Medium,31/10/2026,In Progress,30%,Penyusunan dokumen proposal
TSK-014,ADDITIONAL,SGA,Progress Team ZeroAxis optimasi robot arm,Auzan Asarudin,High,31/10/2026,In Progress,80%,Evaluasi hasil uji coba`;
const PR={Critical:0,High:1,Medium:2,Low:3},XPV={Critical:150,High:100,Medium:50,Low:20},STS=['Not Started','In Progress','Paused','Completed','Blocked'],KEY='empsim_v1';
let S,tab='office',cur=null,imp=null,rp='today',flt={q:'',team:'',st:''},warned=false;
const today=()=>new Date().toLocaleDateString('en-CA'),sameDay=ts=>new Date(ts).toLocaleDateString('en-CA')===today();
const fd=i=>i?i.split('-').reverse().join('/'):'',num=id=>parseInt((String(id).match(/(\d+)$/)||[0,0])[1]),uid=()=>'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fdt=ts=>{if(!ts)return '';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())};
const histH=t=>`<h3>History data</h3><small>Insert Date: ${fdt(t.ins)||'-'} · Update Date: ${fdt(t.upd)||'-'}</small><div style='max-height:150px;overflow:auto'>${(t.hist||[]).slice().reverse().map(h=>`<div class='qi' style='--c:var(--Low);padding:4px 8px;margin-top:4px'><b>${fdt(h.ts)}</b><br><small>${esc(h.x)}</small></div>`).join('')||'<small>Belum ada riwayat.</small>'}</div>`;
function pd(s){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(!m)return null;const d=+m[1],o=+m[2],y=+m[3],D=new Date(y,o-1,d);if(D.getFullYear()!==y||D.getMonth()!==o-1||D.getDate()!==d)return null;return y+'-'+String(o).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
const isAct=t=>t.st!=='Completed',isOver=t=>isAct(t)&&t.dl&&t.dl<today(),isUrg=t=>isAct(t)&&(t.prio==='Critical'||t.prio==='High'||isOver(t));
const sortU=(a,b)=>(PR[a.prio]-PR[b.prio])||((a.dl||'9')<(b.dl||'9')?-1:(a.dl||'9')>(b.dl||'9')?1:0);
function due(t){if(!t.dl)return 'tanpa deadline';const n=Math.round((new Date(t.dl)-new Date(today()))/864e5);return n<0?'lewat '+(-n)+' hari':n===0?'hari ini':n===1?'besok':n+' hari · '+fd(t.dl).slice(0,5)}
const empTasks=e=>S.tasks.filter(t=>t.team===e.team&&t.pic===e.name);
const totalXP=()=>S.tasks.filter(t=>t.xp).reduce((a,t)=>a+(t.xpv||XPV[t.prio]),0)+((S.bonus||[]).reduce((a,b)=>a+b.xp,0)),lvOf=x=>Math.floor(Math.sqrt(x/100))+1;
const rank=l=>l<=5?'Junior Engineer':l<=10?'Engineer':l<=20?'Advanced Engineer':l<=30?'Senior Engineer':'Engineering Specialist';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){if(!warned){warned=true;toast('Penyimpanan browser tidak tersedia: data hanya bertahan selama halaman terbuka','err')}return false}}
function toast(m,k){const t=$('#toast');t.textContent=m;t.className=k||'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function mk(id){return{id:uid(),taskId:id,team:'',sub:'',desc:'',pic:'',prio:'Medium',dl:null,st:'Not Started',pg:0,nt:'',xp:false,done:null,ins:Date.now(),upd:Date.now(),hist:[{ts:Date.now(),x:'Dibuat'}],_n:1}}
function nextId(){S.seq++;return 'TSK-'+String(S.seq).padStart(3,'0')}
function upd(t,p){const b={...t},r=upd0(t,p);if(t._n){delete t._n}else{const L={team:'Tim',sub:'Sub-job',desc:'Deskripsi',pic:'PIC',prio:'Prioritas',dl:'Deadline',st:'Status',pg:'Progress',nt:'Notes'},d=[];for(const k in L)if(b[k]!==t[k])d.push(L[k]+': '+(k==='dl'?fd(b[k]):k==='pg'?b[k]+'%':b[k]||'-')+' → '+(k==='dl'?fd(t[k]):k==='pg'?t[k]+'%':t[k]||'-'));if(d.length){t.upd=Date.now();t.hist=(t.hist||[]).concat([{ts:t.upd,x:d.join('; ')}]).slice(-50)}}return r}
function upd0(t,p){const was=t.st;Object.assign(t,p);
 if('pg' in p&&!('st' in p)){if(t.pg>=100)t.st='Completed';else if(t.st==='Completed')t.st='In Progress';else if(t.pg>0&&t.st==='Not Started')t.st='In Progress'}
 if(t.st==='Completed'){t.pg=100;if(!t.done)t.done=Date.now();if(!t.xp){t.xp=true;t.xpv=calcXP(t);return t.xpv}}

 else if(a==='applysk'){if(!skp)return;S.skx=S.skx||{};S.skw=S.skw||{};S.cs=S.cs||[];const all=new Set(TEAMS.flatMap(t=>t.subs));let n=0;for(const sub in skp){if(!all.has(sub))continue;const ids=[];skp[sub].forEach(it=>{const nm=String(it.skill||'').trim().slice(0,40);if(!nm)return;let s=allSk().find(x=>x.n.toLowerCase()===nm.toLowerCase());if(!s){s={id:'c'+uid(),n:nm,c:String(it.kategori||'Soft Skills').slice(0,40)};S.cs.push(s);n++}if(it.alasan)S.skw[s.id]=String(it.alasan).slice(0,120);if(s.id!==skOf(sub))ids.push(s.id)});S.skx[sub]=ids}skp=null;persist();closeM();render();toast('Skill diterapkan ('+n+' skill baru)')}
 else if(a==='start')chg(d.id,{st:'In Progress'},'Quest dimulai, semangat!');
 else if(a==='claim'){const q=DQ.find(x=>x.id===d.id),c=S.claims[today()]=S.claims[today()]||[];if(!q||!q.ok()||c.includes(q.id))return;const l0=lvOf(totalXP());c.push(q.id);S.bonus.push({ts:Date.now(),xp:q.xp,why:'Misi: '+q.n});persist();render();toast('Misi selesai! +'+q.xp+' XP'+(lvOf(totalXP())>l0?' · LEVEL UP!':''))}
 else if(a==='coach')coach();
 else if(a==='goal'){const v=parseInt($('#gl').value);if(v>0){S.goal=v;persist();render();toast('Target mingguan disimpan')}}
 else if(a==='newsk')openSkForm();
 else if(a==='savesk'){const n=$('#sn').value.trim(),c=$('#sc2').value.trim()||$('#sc').value;if(!n){toast('Isi nama skill','err');return}if(allSk().some(s=>s.n.toLowerCase()===n.toLowerCase())){toast('Skill sudah ada','err');return}const id='c'+uid();S.cs.push({id,n,c});document.querySelectorAll('.sk-c:checked').forEach(i=>{S.skmap[i.value]=id});persist();closeM();render();toast('Skill baru: '+n)}
 else if(a==='mksk'){const id='c'+uid();S.cs.push({id,n:d.s,c:'Skill Baru'});S.skmap[d.s]=id;persist();render();toast('Skill baru dibuat: '+d.s)}
 else if(a==='bkup')dl('backup_employee_sim.json',JSON.stringify(S));
 else if(a==='rstw')modal(`<h2>Restore Backup</h2><p><small>Tempel isi file backup (.json). Data saat ini akan diganti.</small></p><textarea id='rs' rows='6' style='width:100%' aria-label='Isi backup'></textarea><div class='acts'><button class='pr' data-act='dorst'>Restore</button><button data-act='close'>Batal</button></div>`);
 else if(a==='dorst'){try{const o=JSON.parse($('#rs').value.replace(/^\ufeff/,'').trim());if(!Array.isArray(o.tasks)||!Array.isArray(o.emps))throw 0;S=o;applyS();persist();closeM();render();toast('Backup dipulihkan')}catch(e){toast('Teks backup tidak valid','err')}}
 else if(a==='tsub'){const e=S.emps.find(x=>x.id===d.id);if(!e)return;const l=subsOf(e).slice(),i=l.indexOf(d.s);if(i>=0)l.splice(i,1);else l.push(d.s);e.subs=l;persist();refresh();toast(i>=0?'Sub-job dicabut: '+d.s:'Sub-job ditugaskan: '+d.s)}
 else if(a==='renteam')openTeamRename(d.c);
 else if(a==='saverteam'){const o=d.c,n=$('#tn').value.trim().toUpperCase(),T=TEAMS.find(t=>t.c===o);if(!T)return;if(!n){toast('Isi nama tim','err');return}if(n===o){closeM();return}if(TEAMS.some(t=>t.c.toLowerCase()===n.toLowerCase())){toast('Nama tim sudah ada','err');return}
  S.emps.forEach(e=>{if(e.team===o)e.team=n});S.tasks.forEach(t=>{if(t.team===o)t.team=n});T.c=n;if(!T.custom){S.rn=S.rn||{};S.rn[T.o]=n}if(flt.team===o)flt.team=n;persist();closeM();render();toast('Nama tim diubah: '+o+' → '+n)}
 else if(a==='newteam')openTeamForm();
 else if(a==='saveteam'){const n=$('#tn').value.trim().toUpperCase(),subs=[...new Set($('#ts').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))],en=$('#te').value.trim();
  if(!n){toast('Isi nama tim','err');return}if(TEAMS.some(t=>t.c.toLowerCase()===n.toLowerCase())){toast('Nama tim sudah ada','err');return}if(!subs.length){toast('Isi minimal satu sub-job','err');return}
  const T={c:n,col:$('#tc').value,subs,custom:true};TEAMS.push(T);S.teams=S.teams||[];S.teams.push(T);S.emps.push({id:'e'+uid(),team:n,name:en||'Karyawan 1'});persist();closeM();render();toast('Tim '+n+' ditambahkan')}
 else if(a==='delteam'){if(!b.dataset.k){b.dataset.k=1;b.textContent='Yakin? Karyawan & quest tim ikut terhapus';return}const c=d.c,i=TEAMS.findIndex(t=>t.c===c&&t.custom);if(i<0)return;TEAMS.splice(i,1);S.teams=(S.teams||[]).filter(t=>t.c!==c);S.emps=S.emps.filter(e=>e.team!==c);S.tasks=S.tasks.filter(t=>t.team!==c);if(flt.team===c)flt.team='';persist();render();toast('Tim '+c+' dihapus')}
 else if(a==='sheet')openSheet();
 else if(a==='sread'){const v=$('#sp').value.trim();if(!v){toast('Tempel data dari Sheet dulu','err');return}previewImport({name:'Google Sheet',size:v.length},v)}
 else if(a==='scopy'){const t=Papa.unparse(Papa.parse(toCSV(S.tasks)).data,{delimiter:'\t'}),o=$('#so');o.value=t;o.style.display='block';o.select();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Data disalin. Tempel di sel A1 pada Sheet'),()=>toast('Tekan Ctrl+C untuk menyalin teks yang terpilih','err'))}
 else if(a==='urg')openUrgent();else if(a==='newemp')openEmpForm();
 else if(a==='saveemp'){const n=$('#en').value.trim(),t=$('#et').value;if(!n){toast('Isi nama','err');return}if(S.emps.some(x=>x.team===t&&x.name.toLowerCase()===n.toLowerCase())){toast('Nama sudah ada di tim itu','err');return}S.emps.push({id:'e'+uid(),team:t,name:n});persist();closeM();render();toast('Karyawan ditambahkan')}
 else if(a==='imp')openImport();else if(a==='doimp')doImport();
 else if(a==='tpl')dl('template_tugas.csv',CSV);else if(a==='expall')dl('semua_tugas.csv',toCSV(S.tasks));else if(a==='expflt')dl('tugas_filter.csv',toCSV(filtered()));
 else if(a==='expdone')dl('laporan_selesai.csv',toCSV(repData().dn));else if(a==='print'){try{window.print()}catch(x){toast('Cetak tidak tersedia di sini; gunakan Ctrl+P','err')}}
 else if(a==='deldemo'||a==='rst'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Yakin?';return}if(a==='rst')seed();else{S.tasks=S.tasks.filter(t=>!t.demo);persist()}render();toast(a==='rst'?'Data demo dikembalikan':'Task demo dihapus')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ch==='st')chg(t.dataset.id,{st:t.value},'Status diperbarui');else if(t.dataset.ch==='pg')chg(t.dataset.id,{pg:Math.max(0,Math.min(100,parseInt(t.value)||0))},'Progress diperbarui');
 else if(t.dataset.flt){flt[t.dataset.flt]=t.value;render()}else if('rp' in t.dataset){rp=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){flt.q=e.target.value;$('#tb').innerHTML=rowsH()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
render();
</script></body></html>
